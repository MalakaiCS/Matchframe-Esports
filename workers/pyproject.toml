[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "matchframe-workers"
version = "0.1.0"
description = "Matchframe Esports offline demo pipeline: CS2 demo extraction, map packs, utility profiles, features, training and evaluation."
requires-python = ">=3.11"
dependencies = [
  "demoparser2>=0.42",
  "polars>=1.0",
  "pyarrow>=15",
  "duckdb>=1.0",
  "lightgbm>=4.0",
  "numpy>=1.26",
  "pandas>=2.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "scikit-learn>=1.4"]

[project.scripts]
matchframe-workers = "mf_common.cli:main"

[tool.setuptools.packages.find]
where = ["common", "demo-parser", "features", "training", "evaluation"]
include = ["mf_*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: runs against real demos (requires MF_TEST_DEMOS)",
]
filterwarnings = [
  "ignore:Sortedness of columns cannot be checked:UserWarning",
]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "BLE", "PIE"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["mf_common", "mf_demo_parser", "mf_features", "mf_training", "mf_evaluation", "synthetic_demo", "conftest"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
mypy_path = ["common", "demo-parser", "features", "training", "evaluation"]
explicit_package_bases = true
