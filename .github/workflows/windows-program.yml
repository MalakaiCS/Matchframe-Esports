# Builds the Matchframe program for Windows (.exe installer + portable zip) on a real Windows
# machine, installs it silently, smoke-tests the INSTALLED program (opens into the HUD Library with
# the bundled HUDs, a real sign-in against a local Matchframe website under Settings → Account,
# bundled engine, console from app://matchframe, HUD outputs, no console from the engine's HTTP
# address), checks the transparent desktop HUD on the real desktop (screen pixels over another
# window, click-through, focus, OBS output, recovery, clean quit; scripts/overlay-check.cjs),
# uninstalls it, and uploads the installer with SHA-256 checksums as a workflow artifact.
#
# Website: the build is pinned to the live website (address + licence keys in cloud.json, read from
# it at build time). Set the repository variable MATCHFRAME_WEBSITE_URL to change it.
#
# Releases: publishing a release on GitHub (Releases → Draft a new release → Publish) builds that
# release's tag and attaches the installer, the portable zip and SHA256SUMS.txt to it. Running this
# workflow manually with a tag builds that tag and attaches the files to its release, creating and
# publishing the release first (notes from docs/release-notes/<version>-dev.md) when there is none.
# A tag that does not exist yet is created by the release, on the commit of the branch the run was
# started from (that commit is what gets built).
# Builds are unsigned unless CSC_LINK / CSC_KEY_PASSWORD secrets are configured.
name: Windows program (.exe)

on:
  push:
    branches: ["**"]
    paths:
      - "apps/desktop/**"
      - "apps/operator-web/**"
      - "apps/hud-renderer/**"
      - "apps/hud-template/**"
      - "services/local-engine/**"
      - "services/observer-agent/**"
      - "services/replay-agent/**"
      - "packages/**"
      - "assets/**"
      - "config/**"
      - "scripts/packaged-smoke.cjs"
      - "scripts/overlay-check.cjs"
      - "scripts/smoke-cloud.cjs"
      - "scripts/write-cloud-config.mjs"
      - "services/cloud-api/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-program.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.3). A new tag and its release are created on the selected branch's latest commit. Leave empty for a test build of the selected branch."
        required: false
        default: ""

permissions:
  contents: read

env:
  MATCHFRAME_WEBSITE_URL: ${{ vars.MATCHFRAME_WEBSITE_URL || 'https://matchframe-esports-production.up.railway.app' }}

concurrency:
  group: windows-program-${{ github.ref }}-${{ inputs.tag || 'branch' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, install and smoke-test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Choose what to build
        id: ref
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        # A manual run for an existing tag builds exactly that tag; a new tag is created on the
        # selected branch's commit by the release, so that commit is built.
        run: |
          if [ -n "$TAG" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the console, captain page, HUD renderer, bundled HUD packages and program bundles
        run: |
          pnpm --filter @matchframe/hud-renderer build
          pnpm --filter @matchframe/hud-template build
          pnpm --filter @matchframe/operator-web build
          pnpm --filter @matchframe/desktop build

      - name: Pin the Matchframe website (address and licence keys)
        id: pin
        # Required for releases; a test build of a branch still builds (asking for the address) if the website is down.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: node scripts/write-cloud-config.mjs "${{ env.MATCHFRAME_WEBSITE_URL }}"

      - name: Package the installer (.exe) and portable zip
        run: pnpm --filter @matchframe/desktop run package:win
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Install the program silently (per user)
        shell: pwsh
        run: |
          $setup = Get-ChildItem apps/desktop/release/MatchframeEsports-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\Matchframe Esports\Matchframe Esports.exe'
          if (-not (Test-Path $installed)) { throw "The installer did not create $installed" }
          "INSTALLED_EXE=$installed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke-test the installed program
        shell: pwsh
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$env:RUNNER_TEMP\pw" playwright-core@1.63.0
          $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
          node scripts/packaged-smoke.cjs "$env:INSTALLED_EXE" "$env:RUNNER_TEMP\installed-program.png"
        env:
          MATCHFRAME_EXPECT_WEBSITE: ${{ steps.pin.outcome == 'success' && env.MATCHFRAME_WEBSITE_URL || '' }}

      - name: Check the transparent desktop HUD (pixels, click-through, focus, OBS output, quit)
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
          node scripts/overlay-check.cjs "$env:INSTALLED_EXE" "$env:RUNNER_TEMP\overlay-check.json"

      - name: Uninstall
        if: always()
        shell: pwsh
        run: |
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\Matchframe Esports\Uninstall Matchframe Esports.exe'
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File apps/desktop/release/SHA256SUMS.txt -Encoding ascii
          Get-Content apps/desktop/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: matchframe-windows-${{ github.sha }}
          path: |
            apps/desktop/release/MatchframeEsports-Setup-*.exe
            apps/desktop/release/*.zip
            apps/desktop/release/SHA256SUMS.txt
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-program-screenshot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/installed-program*.png
            ${{ runner.temp }}/overlay-check*
          if-no-files-found: ignore
          retention-days: 30

  attach-to-release:
    name: Attach the installer to the GitHub release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          sparse-checkout: docs/release-notes
      - name: Create the release if it does not exist yet (manual run with a new tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          version="${TAG#v}"
          notes="docs/release-notes/${version}-dev.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Version ${version} Beta Matchframe Esports" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Version ${version} Beta Matchframe Esports" --generate-notes
          fi
      - uses: actions/download-artifact@v4
        with:
          name: matchframe-windows-${{ github.sha }}
          path: release
      - name: Upload the installer, zip and checksums to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
