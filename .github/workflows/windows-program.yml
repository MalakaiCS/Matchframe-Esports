# Builds the MatchFrame program for Windows (.exe installer + portable zip) on a real Windows
# machine, installs it silently, smoke-tests the INSTALLED program (opens into the HUD Library with
# the bundled HUDs, a real sign-in against a local MatchFrame website under Settings → Account,
# bundled engine, console from app://matchframe, HUD outputs, no console from the engine's HTTP
# address), checks the transparent desktop HUD on the real desktop (screen pixels over another
# window, click-through, focus, OBS output, recovery, clean quit; scripts/overlay-check.cjs),
# uninstalls it, and uploads the installer with SHA-256 checksums as a workflow artifact.
#
# Website: the build is pinned to the live website (address + licence keys in cloud.json, read from
# it at build time). Set the repository variable MATCHFRAME_WEBSITE_URL to change it.
#
# Releases: publishing a release on GitHub (Releases → Draft a new release → Publish) builds that
# release's tag and attaches the installer, the portable zip, SHA256SUMS.txt and the update files
# (latest.yml and the installer's .blockmap, read by installed programs to update themselves). Running this
# workflow manually with a tag builds that tag and attaches the files to its release, creating and
# publishing the release first (notes from docs/release-notes/<version>-dev.md) when there is none.
# A tag that does not exist yet is created by the release, on the commit of the branch the run was
# started from (that commit is what gets built).
#
# Betas (ADR-076): a version with a prerelease suffix (0.13.0-beta.1, tag v0.13.0-beta.1) writes
# beta.yml instead of latest.yml and is released as a GitHub prerelease, which only programs on the
# Beta update channel take. Stable tags work as before.
#
# Code signing (ADR-076, docs/operations/code-signing.md): unsigned, exactly as before, unless signing
# secrets are set. Azure Artifact Signing (formerly Trusted Signing): secrets AZURE_TENANT_ID,
# AZURE_CLIENT_ID, AZURE_CLIENT_SECRET and variables (or secrets) AZURE_SIGNING_ENDPOINT,
# AZURE_SIGNING_ACCOUNT_NAME, AZURE_SIGNING_CERTIFICATE_PROFILE, AZURE_SIGNING_PUBLISHER_NAME. A
# certificate authority's signing tool: WIN_SIGN_COMMAND and WIN_SIGN_PUBLISHER_NAME (custom-sign.mjs).
# An existing PFX certificate: secrets CSC_LINK (the .pfx in base64) and CSC_KEY_PASSWORD. Signed
# builds are checked with Get-AuthenticodeSignature (installer, program and the installed program must
# be Valid; the signer is printed).
name: Windows program (.exe)

on:
  push:
    branches: ["**"]
    paths:
      - "apps/desktop/**"
      - "apps/operator-web/**"
      - "apps/hud-renderer/**"
      - "apps/hud-designs/**"
      - "services/local-engine/**"
      - "services/observer-agent/**"
      - "services/replay-agent/**"
      - "packages/**"
      - "assets/**"
      - "config/**"
      - "scripts/packaged-smoke.cjs"
      - "scripts/overlay-check.cjs"
      - "scripts/fixtures/**"
      - "scripts/smoke-cloud.cjs"
      - "scripts/smoke-match-art.cjs"
      - "scripts/write-cloud-config.mjs"
      - "services/cloud-api/**"
      - "native/ts3-matchframe-plugin/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/windows-program.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v0.1.3). A new tag and its release are created on the selected branch's latest commit. Leave empty for a test build of the selected branch."
        required: false
        default: ""

permissions:
  contents: read

env:
  MATCHFRAME_WEBSITE_URL: ${{ vars.MATCHFRAME_WEBSITE_URL || 'https://matchframe-esports-production.up.railway.app' }}

concurrency:
  group: windows-program-${{ github.ref }}-${{ inputs.tag || 'branch' }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, install and smoke-test (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Choose what to build
        id: ref
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        # A manual run for an existing tag builds exactly that tag; a new tag is created on the
        # selected branch's commit by the release, so that commit is built.
        run: |
          if [ -n "$TAG" ] && gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Team Comms' TeamSpeak 3 plugin (ADR-065): MSVC, static runtime. The SDK headers are TeamSpeak's
      # (not in the repository): fetched from the official repository at a pinned commit and checked
      # against their SHA-256 (native/ts3-matchframe-plugin/sdk.json). The program ships the .ts3_plugin
      # package and the DLL (apps/desktop/scripts-build.mjs copies them into its resources).
      - name: Build the TeamSpeak 3 plugin (Team Comms)
        shell: pwsh
        # Until this build is proven on the runner, a failure leaves the program without the plugin
        # (plugin.json says built: false) rather than stopping the program's own build and release.
        continue-on-error: true
        run: |
          node native/ts3-matchframe-plugin/scripts/fetch-sdk.mjs
          cmake -S native/ts3-matchframe-plugin -B native/ts3-matchframe-plugin/build -A x64
          cmake --build native/ts3-matchframe-plugin/build --config Release
          node native/ts3-matchframe-plugin/scripts/package.mjs native/ts3-matchframe-plugin/build/Release/matchframe_comms_win64.dll
          # dumpbin is only on PATH in a Visual Studio developer shell: the export check runs where it is.
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) {
            $exports = & dumpbin /exports native/ts3-matchframe-plugin/build/Release/matchframe_comms_win64.dll 2>$null
            if ($LASTEXITCODE -eq 0 -and -not ($exports -match 'ts3plugin_onEditPlaybackVoiceDataEvent')) { throw "the plugin DLL does not export ts3plugin_onEditPlaybackVoiceDataEvent" }
          }

      - name: Build the console, captain page, HUD renderer, bundled HUD packages and program bundles
        run: |
          pnpm --filter @matchframe/hud-renderer build
          pnpm --filter @matchframe/hud-designs build
          pnpm --filter @matchframe/operator-web build
          pnpm --filter @matchframe/desktop build

      - name: Pin the MatchFrame website (address and licence keys)
        id: pin
        # Required for releases; a test build of a branch still builds (asking for the address) if the website is down.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: node scripts/write-cloud-config.mjs "${{ env.MATCHFRAME_WEBSITE_URL }}"

      # Azure Artifact Signing when all of its settings are there, else a certificate authority's own
      # signing tool when WIN_SIGN_COMMAND is there, else a PFX certificate when CSC_LINK is there, else
      # unsigned (as before). A half-set method stops the build rather than releasing an unsigned
      # program by mistake.
      - name: Choose code signing
        id: sign
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT || secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME || secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE || secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME || secrets.AZURE_SIGNING_PUBLISHER_NAME }}
          WIN_SIGN_COMMAND: ${{ vars.WIN_SIGN_COMMAND || secrets.WIN_SIGN_COMMAND }}
          WIN_SIGN_PUBLISHER_NAME: ${{ vars.WIN_SIGN_PUBLISHER_NAME || secrets.WIN_SIGN_PUBLISHER_NAME }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          check() { # method label names...: all set, none set, or stop the build
            local label=$1 present="" missing="" name; shift
            for name in "$@"; do if [ -n "${!name}" ]; then present="$present $name"; else missing="$missing $name"; fi; done
            if [ -n "$present" ] && [ -n "$missing" ]; then echo "::error::$label is only partly set up; missing:$missing (see docs/operations/code-signing.md)"; exit 1; fi
            [ -n "$present" ]
          }
          if check "Azure Artifact Signing" AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT_NAME AZURE_SIGNING_CERTIFICATE_PROFILE AZURE_SIGNING_PUBLISHER_NAME; then
            method=azure; echo "Signing with Azure Artifact Signing (publisher: $AZURE_SIGNING_PUBLISHER_NAME)"
          elif check "The custom signing command" WIN_SIGN_COMMAND WIN_SIGN_PUBLISHER_NAME; then
            method=custom; echo "Signing with the custom signing command (publisher: $WIN_SIGN_PUBLISHER_NAME)"
          elif [ -n "$CSC_LINK" ]; then
            method=pfx; echo "Signing with the PFX certificate (CSC_LINK)"
          else
            method=none; echo "No signing secrets: building unsigned"
          fi
          echo "method=$method" >> "$GITHUB_OUTPUT"

      - name: Package the installer (.exe) and portable zip
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          SIGN_METHOD: ${{ steps.sign.outputs.method }}
          # PFX certificate (only when that's the method).
          CSC_LINK: ${{ steps.sign.outputs.method == 'pfx' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ steps.sign.outputs.method == 'pfx' && secrets.CSC_KEY_PASSWORD || '' }}
          # Azure Artifact Signing: electron-builder's TrustedSigning module signs in as this app registration.
          AZURE_TENANT_ID: ${{ steps.sign.outputs.method == 'azure' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.sign.outputs.method == 'azure' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.sign.outputs.method == 'azure' && secrets.AZURE_CLIENT_SECRET || '' }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT || secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ vars.AZURE_SIGNING_ACCOUNT_NAME || secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_SIGNING_CERTIFICATE_PROFILE: ${{ vars.AZURE_SIGNING_CERTIFICATE_PROFILE || secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}
          AZURE_SIGNING_PUBLISHER_NAME: ${{ vars.AZURE_SIGNING_PUBLISHER_NAME || secrets.AZURE_SIGNING_PUBLISHER_NAME }}
          # Custom signing command (apps/desktop/custom-sign.mjs runs it for each file).
          WIN_SIGN_COMMAND: ${{ steps.sign.outputs.method == 'custom' && (vars.WIN_SIGN_COMMAND || secrets.WIN_SIGN_COMMAND) || '' }}
          WIN_SIGN_PUBLISHER_NAME: ${{ vars.WIN_SIGN_PUBLISHER_NAME || secrets.WIN_SIGN_PUBLISHER_NAME }}
        # Azure's and the custom command's settings go on the command line (electron-builder merges them
        # into electron-builder.yml): electron-builder signs whenever win.azureSignOptions or
        # win.signtoolOptions.sign is set, so the file can't hold them.
        run: |
          args=()
          if [ "$SIGN_METHOD" = azure ]; then
            args+=("-c.win.azureSignOptions.publisherName=$AZURE_SIGNING_PUBLISHER_NAME")
            args+=("-c.win.azureSignOptions.endpoint=$AZURE_SIGNING_ENDPOINT")
            args+=("-c.win.azureSignOptions.codeSigningAccountName=$AZURE_SIGNING_ACCOUNT_NAME")
            args+=("-c.win.azureSignOptions.certificateProfileName=$AZURE_SIGNING_CERTIFICATE_PROFILE")
          elif [ "$SIGN_METHOD" = custom ]; then
            args+=("-c.win.signtoolOptions.sign=./custom-sign.mjs")
            args+=("-c.win.signtoolOptions.publisherName=$WIN_SIGN_PUBLISHER_NAME")
          fi
          pnpm --filter @matchframe/desktop run package:win "${args[@]}"

      - name: Check the code signature (signed builds)
        if: steps.sign.outputs.method != 'none'
        shell: pwsh
        env:
          SIGN_METHOD: ${{ steps.sign.outputs.method }}
          EXPECTED_PUBLISHER: ${{ steps.sign.outputs.method == 'azure' && (vars.AZURE_SIGNING_PUBLISHER_NAME || secrets.AZURE_SIGNING_PUBLISHER_NAME) || steps.sign.outputs.method == 'custom' && (vars.WIN_SIGN_PUBLISHER_NAME || secrets.WIN_SIGN_PUBLISHER_NAME) || '' }}
        run: |
          $setup = (Get-ChildItem apps/desktop/release/MatchFrameEsports-Setup-*.exe | Select-Object -First 1).FullName
          $program = (Resolve-Path 'apps/desktop/release/win-unpacked/MatchFrame Esports.exe').Path
          foreach ($file in @($setup, $program)) {
            $sig = Get-AuthenticodeSignature -FilePath $file
            "$(Split-Path $file -Leaf): $($sig.Status), signed by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "$(Split-Path $file -Leaf) is not validly signed ($($sig.Status): $($sig.StatusMessage))" }
          }
          # Installed programs accept only updates signed by the publisher named in app-update.yml.
          $updateYml = Get-Content apps/desktop/release/win-unpacked/resources/app-update.yml -Raw
          if ($updateYml -notmatch 'publisherName') { throw "app-update.yml names no publisher" }
          # A publisher name typed into GitHub (Azure, custom command) must be the certificate's name exactly.
          if ($env:EXPECTED_PUBLISHER) {
            $name = (Get-AuthenticodeSignature -FilePath $setup).SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
            $setting = if ($env:SIGN_METHOD -eq 'azure') { 'AZURE_SIGNING_PUBLISHER_NAME' } else { 'WIN_SIGN_PUBLISHER_NAME' }
            if ($name -ne $env:EXPECTED_PUBLISHER) { throw "The certificate is issued to '$name' but $setting is '$($env:EXPECTED_PUBLISHER)': installed programs would refuse the next update. Set $setting to '$name'." }
          }

      - name: Check the update metadata (automatic updates)
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          # Stable versions write latest.yml; betas (0.13.0-beta.1) write beta.yml (electron-builder.yml: publish.channel).
          $version = (Get-Content apps/desktop/package.json -Raw | ConvertFrom-Json).version
          $beta = $version.Contains('-')
          if ($beta -and $version -notmatch '^\d+\.\d+\.\d+-beta\.\d+$') { throw "A prerelease version must look like 0.13.0-beta.1 (the program's version is $version)" }
          if ($env:TAG -and ($env:TAG.Contains('-') -ne $beta)) { throw "The tag $($env:TAG) and the program's version $version disagree about being a beta" }
          $channelFile = if ($beta) { 'beta.yml' } else { 'latest.yml' }
          $otherFile = if ($beta) { 'latest.yml' } else { 'beta.yml' }
          if (Test-Path "apps/desktop/release/$otherFile") { throw "version $version must not write $otherFile" }
          $setup = (Get-ChildItem apps/desktop/release/MatchFrameEsports-Setup-*.exe | Select-Object -First 1).Name
          $yml = Get-Content "apps/desktop/release/$channelFile" -Raw
          if ($yml -notmatch [regex]::Escape($setup)) { throw "$channelFile does not name $setup" }
          if (-not (Test-Path "apps/desktop/release/$setup.blockmap")) { throw "missing $setup.blockmap" }
          if (-not (Test-Path apps/desktop/release/win-unpacked/resources/app-update.yml)) { throw "the program has no app-update.yml" }
          Get-Content apps/desktop/release/win-unpacked/resources/app-update.yml
          $yml

      - name: Install the program silently (per user)
        shell: pwsh
        env:
          SIGN_METHOD: ${{ steps.sign.outputs.method }}
        run: |
          $setup = Get-ChildItem apps/desktop/release/MatchFrameEsports-Setup-*.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $installed = Join-Path $env:LOCALAPPDATA 'Programs\MatchFrame Esports\MatchFrame Esports.exe'
          if (-not (Test-Path $installed)) { throw "The installer did not create $installed" }
          if ($env:SIGN_METHOD -ne 'none') {
            $sig = Get-AuthenticodeSignature -FilePath $installed
            "Installed program: $($sig.Status), signed by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "The installed program is not validly signed ($($sig.Status): $($sig.StatusMessage))" }
          }
          "INSTALLED_EXE=$installed" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Smoke-test the installed program
        timeout-minutes: 20
        shell: pwsh
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$env:RUNNER_TEMP\pw" playwright-core@1.63.0
          $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
          node scripts/packaged-smoke.cjs "$env:INSTALLED_EXE" "$env:RUNNER_TEMP\installed-program.png"
        env:
          MATCHFRAME_EXPECT_WEBSITE: ${{ steps.pin.outcome == 'success' && env.MATCHFRAME_WEBSITE_URL || '' }}

      - name: Check the transparent desktop HUD (pixels, click-through, focus, OBS output, quit)
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP\pw\node_modules"
          node scripts/overlay-check.cjs "$env:INSTALLED_EXE" "$env:RUNNER_TEMP\overlay-check.json"

      - name: Uninstall
        if: always()
        timeout-minutes: 5
        shell: pwsh
        run: |
          # A program left running by a failed check would make the uninstaller wait for ever.
          Get-Process -Name 'MatchFrame Esports' -ErrorAction SilentlyContinue | Stop-Process -Force
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Programs\MatchFrame Esports\Uninstall MatchFrame Esports.exe'
          if (Test-Path $uninstaller) { Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait }

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem apps/desktop/release -File | Where-Object { $_.Extension -in '.exe', '.zip' } |
            ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } |
            Out-File apps/desktop/release/SHA256SUMS.txt -Encoding ascii
          Get-Content apps/desktop/release/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: matchframe-windows-${{ github.sha }}
          # latest.yml (beta.yml for a beta) and the .blockmap are what installed programs read to update themselves.
          path: |
            apps/desktop/release/MatchFrameEsports-Setup-*.exe
            apps/desktop/release/MatchFrameEsports-Setup-*.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/beta.yml
            apps/desktop/release/*.zip
            apps/desktop/release/SHA256SUMS.txt
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installed-program-screenshot-${{ github.sha }}
          path: |
            ${{ runner.temp }}/installed-program*.png
            ${{ runner.temp }}/overlay-check*
          if-no-files-found: ignore
          retention-days: 30

  attach-to-release:
    name: Attach the installer to the GitHub release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          sparse-checkout: docs/release-notes
      - name: Create the release if it does not exist yet (manual run with a new tag)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then exit 0; fi
          version="${TAG#v}"
          # A version with a prerelease suffix (0.13.0-beta.1) is a beta: a GitHub prerelease.
          prerelease=()
          case "$version" in *-*) prerelease=(--prerelease) ;; esac
          notes="docs/release-notes/${version}-dev.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Version ${version} Beta MatchFrame Esports" "${prerelease[@]}" --notes-file "$notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Version ${version} Beta MatchFrame Esports" "${prerelease[@]}" --generate-notes
          fi
      # A beta published on GitHub without "Set as a pre-release" would be offered to every Stable
      # program (as GitHub's latest release, with no latest.yml): it is marked as a prerelease.
      - name: Mark a beta as a prerelease
        if: contains(github.event.release.tag_name || inputs.tag, '-')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease
      - uses: actions/download-artifact@v4
        with:
          name: matchframe-windows-${{ github.sha }}
          path: release
      - name: Upload the installer, zip, checksums and update files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
