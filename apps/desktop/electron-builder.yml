appId: com.matchframe.esports
productName: MatchFrame Esports
copyright: Copyright © MatchFrame Esports
directories:
  output: release
  buildResources: build
files:
  - dist/main.cjs
  - dist/preload.cjs
  - package.json
extraResources:
  - from: dist/engine
    to: engine
  # The replay feed's NDI binding (grandi and the NDI runtime, next to feed-worker.mjs): electron-builder
  # leaves node_modules folders out unless they are named.
  - from: dist/engine/node_modules
    to: engine/node_modules
    filter:
      - "**/*"
  # Team Comms' TeamSpeak 3 plugin (.ts3_plugin package, DLL, plugin.json; built: false when not built).
  - from: dist/ts3-plugin
    to: ts3-plugin
  # Operator console (shown only inside the program from app://matchframe) and its connection page.
  - from: ../operator-web/dist
    to: operator-web
  - from: connect
    to: connect
  # Captain veto page, served by the engine for scoped captain links.
  - from: ../operator-web/dist-captain
    to: captain-web
  - from: ../hud-renderer/dist
    to: hud-renderer
  # HUD packages installed into the HUD Library on first start (each subfolder is one package).
  - from: ../hud-designs/dist/vector
    to: sample-huds/matchframe-vector
  - from: ../hud-designs/dist/lineup
    to: sample-huds/matchframe-lineup
  - from: ../hud-designs/dist/stage
    to: sample-huds/matchframe-stage
  # Tray icon (the window icon comes from the .exe).
  - from: build/icon.png
    to: icon.png
  - from: ../../assets/map-packs
    to: map-packs
  - from: ../../assets/radars
    to: radars
  - from: ../../assets/utility-profiles
    to: utility-profiles
  # The Test replays button's two sample clips (Automatic replays): played on program to test the replay chain.
  - from: ../../assets/replay-test
    to: replay-test
  # Built-in models (the demo-trained POV model).
  - from: ../../assets/models
    to: models
  - from: ../../workers
    to: workers
    filter:
      - "**/*.py"
      - "**/*.toml"
      - "**/*.md"
      - "!**/__pycache__/**"
      - "!**/.pytest_cache/**"
  # Optional release configuration: website address + pinned licence keys (see config/cloud.example.json).
  - from: ../../config
    to: .
    filter:
      - "cloud.json"
  - from: ../../THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
asar: true
win:
  icon: build/icon.ico
  # The portable zip (the installer's name is under nsis).
  artifactName: MatchFrameEsports-${version}-win.${ext}
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]
  # Code signing (ADR-076, docs/operations/code-signing.md): unsigned unless the Windows workflow has
  # signing secrets. Azure Artifact Signing (formerly Trusted Signing) is turned on by the workflow
  # adding win.azureSignOptions (publisherName, endpoint, codeSigningAccountName,
  # certificateProfileName) on the command line, with the Azure credentials in AZURE_TENANT_ID /
  # AZURE_CLIENT_ID / AZURE_CLIENT_SECRET. A certificate authority's signing tool: the workflow adds
  # win.signtoolOptions.sign (custom-sign.mjs, which runs WIN_SIGN_COMMAND) and publisherName. Neither
  # is set here, because electron-builder signs whenever they are present. An existing PFX certificate
  # comes from the CSC_LINK / CSC_KEY_PASSWORD environment variables. Signed, the program, its helpers,
  # the uninstaller and the installer are signed, and app-update.yml names the publisher, so installed
  # programs accept only updates signed by the same publisher.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  # Installed 0.11.0 programs update from latest.yml, which names this file: the name may change. The
  # uninstall entry and the upgrade path follow appId (kept), not the product or file name.
  artifactName: MatchFrameEsports-Setup-${version}.${ext}
linux:
  icon: build/icon.png
  target: [dir]
  executableName: matchframe-esports
# Automatic updates: the build writes latest.yml (and the installer's .blockmap), which the release
# workflow attaches to the GitHub release; the program (electron-updater) reads them from there.
# Nothing is uploaded by electron-builder itself (--publish never in the package scripts).
publish:
  provider: github
  owner: MalakaiCS
  repo: Matchframe-Esports
  releaseType: release
  # Update channel from the version (ADR-076): latest.yml for 0.13.0, beta.yml for 0.13.0-beta.1 (a
  # GitHub prerelease, read by programs on the Beta update channel). For the GitHub provider
  # electron-builder doesn't take the channel from the version by itself.
  channel: ${channel}
